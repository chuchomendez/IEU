<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tecnología y Gestión - Gastronomía</title>
<style>
:root{
 --naranja:#f57c00;
 --naranja2:#ef6c00;
 --blanco:#ffffff;
 --fondo:#fff8f0;
 --texto:#3d2b1f;
}
*{box-sizing:border-box}
body{
 margin:0;
 font-family:"Segoe UI",Arial,sans-serif;
 background:linear-gradient(135deg,#fff8f0,#ffffff);
 color:var(--texto);
 min-height:100vh;
 display:flex;
 flex-direction:column;
}
header{
 background:linear-gradient(135deg,var(--naranja),var(--naranja2));
 color:white;
 padding:50px 20px;
 text-align:center;
 border-radius:0 0 40px 40px;
}
header h1{
 margin:0;
 font-size:2.5rem;
}
header p{
 font-size:1.1rem;
}
.btn-volver{
 position:absolute;
 top:20px;
 left:20px;
 background:white;
 color:var(--naranja);
 border:none;
 padding:10px 20px;
 border-radius:20px;
 cursor:pointer;
 font-weight:bold;
 text-decoration:none;
 display:inline-block;
}
.btn-volver:hover{
 background:#fff3e0;
}
.container{
 max-width:1200px;
 width:90%;
 margin:40px auto;
}
.clases-grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
 gap:20px;
 margin-bottom:40px;
}
.clase-btn{
 background:white;
 border:3px solid #ffcc80;
 border-radius:15px;
 padding:30px 15px;
 text-align:center;
 text-decoration:none;
 color:var(--texto);
 font-weight:700;
 font-size:1.1rem;
 transition:.3s;
 box-shadow:0 8px 15px rgba(0,0,0,.1);
 cursor:pointer;
 display:flex;
 align-items:center;
 justify-content:center;
 min-height:120px;
}
.clase-btn:hover{
 transform:translateY(-5px);
 background:#fff3e0;
 border-color:var(--naranja);
 box-shadow:0 12px 20px rgba(0,0,0,.15);
}
.numero{
 display:block;
 font-size:2rem;
 margin-bottom:5px;
 color:var(--naranja);
}
footer{
 margin-top:auto;
 background:var(--naranja2);
 color:white;
 padding:20px;
 text-align:center;
}
</style>
</head>

<body>

<a href="index.html" class="btn-volver">← Volver</a>

<header>
<h1>Tecnología y Gestión de la Información</h1>
<p>Gastronomía - Clases</p>
</header>

<div class="container">

<div class="clases-grid">

<a class="clase-btn" href="#">
<span class="numero">1</span>
<span>Clase 1</span>
</a>

<a class="clase-btn" href="#">
<span class="numero">2</span>
<span>Clase 2</span>
</a>

<a class="clase-btn" href="#">
<span class="numero">3</span>
<span>Clase 3</span>
</a>

<a class="clase-btn" href="#">
<span class="numero">4</span>
<span>Clase 4</span>
</a>

<a class="clase-btn" href="#">
<span class="numero">5</span>
<span>Clase 5</span>
</a>

<a class="clase-btn" href="#">
<span class="numero">6</span>
<span>Clase 6</span>
</a>

<a class="clase-btn" href="#">
<span class="numero">7</span>
<span>Clase 7</span>
</a>

<a class="clase-btn" href="#">
<span class="numero">8</span>
<span>Clase 8</span>
</a>

<a class="clase-btn" href="#">
<span class="numero">9</span>
<span>Clase 9</span>
</a>

<a class="clase-btn" href="#">
<span class="numero">10</span>
<span>Clase 10</span>
</a>

</div>

</div>

<footer>
Plataforma Educativa - Tecnología y Gestión
</footer>

</body>
</html>
